events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8081;
    client_max_body_size 1m;
    location / {
      set $harness_upstream harness:8081;
      proxy_pass http://$harness_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }
  }
  server {
    listen 8080;
    client_max_body_size 8m;
    location / {
      set $memory_upstream memory-service:8080;
      proxy_pass http://$memory_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }
  }
  server {
    listen 4318;
    client_max_body_size 8m;
    location / {
      set $otel_upstream otel-collector:4318;
      proxy_pass http://$otel_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
