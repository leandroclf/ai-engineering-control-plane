events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8081;
    client_max_body_size 1m;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    location = /litellm {
      proxy_pass http://litellm:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /litellm;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /litellm/ {
      proxy_pass http://litellm:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /litellm;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location = /browser {
      proxy_pass http://neo4j:7474/browser/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /browser;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /browser/ {
      proxy_pass http://neo4j:7474/browser/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /browser;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location = /pgadmin {
      proxy_pass http://pgadmin:80/pgadmin/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /pgadmin;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /pgadmin/ {
      proxy_pass http://pgadmin:80/pgadmin/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /pgadmin;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location = /redisinsight {
      proxy_pass http://redisinsight:5540/redisinsight/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /redisinsight;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /redisinsight/ {
      proxy_pass http://redisinsight:5540/redisinsight/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /redisinsight;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location / {
      set $harness_upstream harness:8081;
      proxy_pass http://$harness_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }
  }
  server {
    listen 8080;
    client_max_body_size 8m;
    location / {
      set $memory_upstream memory-service:8080;
      proxy_pass http://$memory_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }
  }
  server {
    listen 4318;
    client_max_body_size 8m;
    location / {
      set $otel_upstream otel-collector:4318;
      proxy_pass http://$otel_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
