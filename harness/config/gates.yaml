{
  "version": "gates-v1",
  "gates": {
    "build": { "provider": "project", "capability": "build", "required": true },
    "lint": { "provider": "project", "capability": "lint", "required": false },
    "changed-tests": { "provider": "project", "capability": "changed-tests", "required": true },
    "unit-tests": { "provider": "project", "capability": "unit-tests", "required": true },
    "integration-tests": { "provider": "project", "capability": "integration-tests", "required": false },
    "coverage": { "provider": "project", "capability": "coverage", "required": false },
    "secret-diff": { "provider": "gitleaks", "mode": "diff" },
    "sast-diff": { "provider": "semgrep", "mode": "diff" },
    "semgrep": { "provider": "semgrep", "mode": "full" },
    "trivy": { "provider": "trivy", "mode": "full" },
    "gitleaks": { "provider": "gitleaks", "mode": "full" }
  }
}
