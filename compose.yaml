name: aicp

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./.aicp/otel:/var/lib/otel
    networks: [agent-internal]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5}
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicp
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ${AICP_STATE_DIR:-./state}/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicp -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.4@sha256:5a93f6b2e391b78e8bd3f9e7e1e1e06aeb5295043b4703fb88392835cec924a0}
    restart: unless-stopped
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --save '' --appendonly no"]
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1@sha256:0ddfa71c8f0bfe0d780d74fb66b985de4767bbd274bab70c0806cb3a6deec101}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/aicp/entrypoint.sh"]
    command: ["neo4j"]
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 1g
    volumes:
      - ${AICP_STATE_DIR:-./state}/neo4j/data:/data
      - ${AICP_STATE_DIR:-./state}/neo4j/logs:/logs
      - ./docker/neo4j/entrypoint.sh:/aicp/entrypoint.sh:ro
    secrets: [neo4j_auth]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [data]

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/aicp/entrypoint.sh"]
    environment:
      LITELLM_OTEL_V2: "true"
      OTEL_EXPORTER: otlp_http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CODING_STRONG_MODEL: ${CODING_STRONG_MODEL:-}
      CODING_STRONG_SECONDARY_MODEL: ${CODING_STRONG_SECONDARY_MODEL:-}
      CODING_FAST_MODEL: ${CODING_FAST_MODEL:-}
      ARCHITECTURE_MODEL: ${ARCHITECTURE_MODEL:-}
      ARCHITECTURE_SECONDARY_MODEL: ${ARCHITECTURE_SECONDARY_MODEL:-}
      SECURITY_MODEL: ${SECURITY_MODEL:-}
      SECURITY_SECONDARY_MODEL: ${SECURITY_SECONDARY_MODEL:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      REVIEW_SECONDARY_MODEL: ${REVIEW_SECONDARY_MODEL:-}
      AICP_OPENAI_STRONG_INPUT_PRICE: ${AICP_OPENAI_STRONG_INPUT_PRICE:-}
      AICP_OPENAI_STRONG_OUTPUT_PRICE: ${AICP_OPENAI_STRONG_OUTPUT_PRICE:-}
      AICP_OPENAI_FAST_INPUT_PRICE: ${AICP_OPENAI_FAST_INPUT_PRICE:-}
      AICP_OPENAI_FAST_OUTPUT_PRICE: ${AICP_OPENAI_FAST_OUTPUT_PRICE:-}
      AICP_ANTHROPIC_STRONG_INPUT_PRICE: ${AICP_ANTHROPIC_STRONG_INPUT_PRICE:-}
      AICP_ANTHROPIC_STRONG_OUTPUT_PRICE: ${AICP_ANTHROPIC_STRONG_OUTPUT_PRICE:-}
      OTEL_SERVICE_NAME: aicp-litellm
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: no_content
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    secrets: [postgres_password, litellm_master_key, litellm_salt_key, openai_api_key, anthropic_api_key, gemini_api_key]
    volumes:
      - ./litellm/generated/config.yaml:/app/config.yaml:ro
      - ./docker/litellm/entrypoint.sh:/aicp/entrypoint.sh:ro
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [agent-internal, provider-egress, data]

  memory-service:
    build:
      context: .
      dockerfile: docker/memory-service/Dockerfile
      args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a}" }
      sbom: true
      provenance: mode=max
    restart: unless-stopped
    environment:
      PORT: 8080
      MEMORY_SERVICE_TOKEN_FILE: /run/secrets/memory_service_token
      MEMORY_AUTHORIZED_SCOPES: ${MEMORY_AUTHORIZED_SCOPES:-GLOBAL:local,ORGANIZATION:local,SOLUTION:local,PROJECT:local,REPOSITORY:site-lf-solucoes,REPOSITORY:ai-engineering-control-plane,AGENT:opencode,TASK:local,RUN:local,EXECUTION:local}
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      EMBEDDING_ALIAS: embeddings
      EMBEDDING_DIMENSIONS: 1536
      CONTEXT_TOKEN_MODEL: coding-fast
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    entrypoint: ["/bin/sh", "/aicp/entrypoint.sh"]
    secrets: [postgres_password, memory_service_token, litellm_api_key, neo4j_auth]
    volumes:
      - ./docker/memory-service/entrypoint.sh:/aicp/entrypoint.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      litellm: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    networks: [agent-internal, data]

  workspace:
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.21}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a}
      sbom: true
      provenance: mode=max
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      OPENCODE_CONFIG_DIR: /home/dev/.config/opencode
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      MEMORY_SERVICE_URL: http://memory-service:8080
      MEMORY_SERVICE_TOKEN_FILE: /run/secrets/memory_service_token
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ${ACTIVE_PROJECT_DIR:-./projects/site-lf-solucoes}:/workspace/project
      - ./opencode:/home/dev/.config/opencode:ro
      - opencode-state:/home/dev/.local/share/opencode
      - workspace-local-state:/home/dev/.local/state
      - workspace-cache:/home/dev/.cache
    secrets: [litellm_api_key, memory_service_token]
    command: ["sleep", "infinity"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    depends_on:
      litellm: { condition: service_healthy }
      memory-service: { condition: service_healthy }
    networks: [agent-internal]

  harness:
    build:
      context: .
      dockerfile: docker/harness/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.21}
        DEV_UID: ${LOCAL_UID:-1000}
        DEV_GID: ${LOCAL_GID:-1000}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a}
      sbom: true
      provenance: mode=max
    restart: unless-stopped
    environment:
      HARNESS_PORT: 8081
      PROJECTS_ROOT: /workspace
      OPENCODE_CONFIG_DIR: /home/dev/.config/opencode
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      MEMORY_SERVICE_URL: http://memory-service:8080
      MEMORY_SERVICE_TOKEN_FILE: /run/secrets/memory_service_token
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CODING_STRONG_MODEL: ${CODING_STRONG_MODEL:-}
      CODING_STRONG_SECONDARY_MODEL: ${CODING_STRONG_SECONDARY_MODEL:-}
      CODING_FAST_MODEL: ${CODING_FAST_MODEL:-}
      ARCHITECTURE_MODEL: ${ARCHITECTURE_MODEL:-}
      ARCHITECTURE_SECONDARY_MODEL: ${ARCHITECTURE_SECONDARY_MODEL:-}
      SECURITY_MODEL: ${SECURITY_MODEL:-}
      SECURITY_SECONDARY_MODEL: ${SECURITY_SECONDARY_MODEL:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      REVIEW_SECONDARY_MODEL: ${REVIEW_SECONDARY_MODEL:-}
      AICP_OPENAI_STRONG_INPUT_PRICE: ${AICP_OPENAI_STRONG_INPUT_PRICE:-}
      AICP_OPENAI_STRONG_OUTPUT_PRICE: ${AICP_OPENAI_STRONG_OUTPUT_PRICE:-}
      AICP_OPENAI_FAST_INPUT_PRICE: ${AICP_OPENAI_FAST_INPUT_PRICE:-}
      AICP_OPENAI_FAST_OUTPUT_PRICE: ${AICP_OPENAI_FAST_OUTPUT_PRICE:-}
      AICP_ANTHROPIC_STRONG_INPUT_PRICE: ${AICP_ANTHROPIC_STRONG_INPUT_PRICE:-}
      AICP_ANTHROPIC_STRONG_OUTPUT_PRICE: ${AICP_ANTHROPIC_STRONG_OUTPUT_PRICE:-}
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    secrets: [postgres_password, harness_service_token, litellm_api_key, memory_service_token]
    volumes:
      - ${ACTIVE_PROJECT_DIR:-./projects/site-lf-solucoes}:/workspace/project
      - ./opencode:/home/dev/.config/opencode:ro
      - harness-opencode-state:/home/dev/.local/share/opencode
      - scanner-data:/security/trivy:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/dev/.cache:size=512m,uid=1000,gid=1000
      - /home/dev/.local/state:size=128m,uid=1000,gid=1000
      - /home/dev/.semgrep:size=32m,uid=1000,gid=1000
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
      memory-service: { condition: service_healthy }
      scanner-data-updater: { condition: service_completed_successfully }
    networks: [agent-internal, data]

  scanner-data-updater:
    build:
      context: .
      dockerfile: docker/harness/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.21}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["trivy image --cache-dir /security/trivy --download-db-only && node /aicp/scripts/scanner-bundle-manifest.mjs /security/trivy"]
    volumes: ["scanner-data:/security/trivy"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [provider-egress]

  control-gateway:
    image: ${CONTROL_GATEWAY_IMAGE:-nginx:1.31.4-alpine3.24@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/cache/nginx:size=16m,uid=101,gid=101", "/var/run:size=1m,uid=101,gid=101"]
    volumes: ["./remote/local-control.nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports:
      - "127.0.0.1:${HARNESS_PORT:-18081}:8081"
      - "127.0.0.1:${MEMORY_SERVICE_PORT:-18080}:8080"
      - "127.0.0.1:4318:4318"
    depends_on:
      harness: { condition: service_healthy }
    networks: [agent-internal, control-edge]

networks:
  agent-internal:
    internal: true
  data:
    internal: true
  provider-egress: {}
  control-edge: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  harness_service_token:
    file: ./secrets/harness_service_token
  memory_service_token:
    file: ./secrets/memory_service_token
  litellm_api_key:
    file: ./secrets/litellm_api_key
  neo4j_auth:
    file: ./secrets/neo4j_auth
  litellm_master_key:
    file: ./secrets/litellm_master_key
  litellm_salt_key:
    file: ./secrets/litellm_salt_key
  openai_api_key:
    file: ./secrets/openai_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  gemini_api_key:
    file: ./secrets/gemini_api_key

volumes:
  opencode-state: {}
  workspace-local-state: {}
  workspace-cache: {}
  harness-opencode-state: {}
  scanner-data: {}
