extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  batch: {}
  attributes/redact:
    actions:
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { key: source.code, action: delete }
      - { key: http.request.body, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
      - { key: exception.stacktrace, action: delete }
exporters:
  file/traces: { path: /var/lib/otel/traces.json }
  file/metrics: { path: /var/lib/otel/metrics.json }
  otlphttp/langfuse:
    endpoint: http://host.docker.internal:3000/api/public/otel
    auth: { authenticator: basicauth/langfuse }
    headers: { x-langfuse-ingestion-version: "4" }
service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [file/traces, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/metrics]
