model_list:
  - model_name: coding-strong
    litellm_params:
      model: ${CODING_STRONG_MODEL}
  - model_name: coding-fast
    litellm_params:
      model: ${CODING_FAST_MODEL}
  - model_name: architecture
    litellm_params:
      model: ${ARCHITECTURE_MODEL}
  - model_name: security
    litellm_params:
      model: ${SECURITY_MODEL}
  - model_name: review
    litellm_params:
      model: ${REVIEW_MODEL}
  - model_name: embeddings
    litellm_params:
      model: ${EMBEDDING_MODEL}
  - model_name: aicp-fallback-smoke
    litellm_params:
      model: openai/aicp-intentional-fault
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  fallbacks:
    - coding-strong: [coding-fast]
    - aicp-fallback-smoke: [coding-fast]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
litellm_settings:
  drop_params: true
  success_callback: [otel]
  failure_callback: [otel]
