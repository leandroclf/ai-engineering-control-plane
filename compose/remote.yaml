services:
  remote-gateway:
    image: ${REMOTE_GATEWAY_IMAGE:-nginx:1.31.4-alpine3.24@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913}
    restart: unless-stopped
    user: "${REMOTE_GATEWAY_UID:-1000}:${REMOTE_GATEWAY_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./remote/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/remote/server:/certs:ro
    ports:
      - "${REMOTE_BIND_ADDRESS:-127.0.0.1}:${REMOTE_PORT:-18443}:8443"
    depends_on:
      memory-service: { condition: service_healthy }
      harness: { condition: service_healthy }
    networks: [agent-internal]
