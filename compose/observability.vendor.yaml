name: aicp-observability

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_IN_APP_AGENT_ENABLED: "false"
  QUEUE_CONSUMER_IN_APP_AGENT_RUN_QUEUE_IS_ENABLED: "false"

x-langfuse-dependencies: &langfuse-dependencies
  langfuse-postgres: { condition: service_healthy }
  langfuse-clickhouse: { condition: service_healthy }
  langfuse-redis: { condition: service_healthy }
  langfuse-minio: { condition: service_healthy }

services:
  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE}
    restart: unless-stopped
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: aicp
      LANGFUSE_INIT_ORG_NAME: AI Engineering Control Plane
      LANGFUSE_INIT_PROJECT_ID: aicp-local
      LANGFUSE_INIT_PROJECT_NAME: AICP Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: AICP Operator
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
    ports: ["127.0.0.1:${LANGFUSE_PORT:-3000}:3000"]
    depends_on: *langfuse-dependencies
    networks: [observability-edge, observability-data]

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE}
    restart: unless-stopped
    environment: *langfuse-environment
    depends_on: *langfuse-dependencies
    networks: [observability-data]

  langfuse-postgres:
    image: ${LANGFUSE_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes: [langfuse-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability-data]

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE}
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability-data]

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE}
    restart: unless-stopped
    command: ["sh", "-ec", "exec redis-server --requirepass '$$LANGFUSE_REDIS_PASSWORD' --maxmemory-policy noeviction"]
    environment: { LANGFUSE_REDIS_PASSWORD: "${LANGFUSE_REDIS_PASSWORD}" }
    volumes: [langfuse-redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$LANGFUSE_REDIS_PASSWORD' ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability-data]

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /data/langfuse && exec minio server --address ':9000' --console-address ':9001' /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes: [langfuse-minio:/data]
    ports: ["127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability-edge, observability-data]

networks:
  observability-edge: {}
  observability-data: { internal: true }

volumes:
  langfuse-postgres: {}
  langfuse-clickhouse: {}
  langfuse-clickhouse-logs: {}
  langfuse-redis: {}
  langfuse-minio: {}
